# Site meta
description: "Adriel Kuek — Lab Director and PMTS at DSO National Laboratories. Research in sovereign foundation models, agentic AI, and autonomous research systems."
keywords: ["AI", "Machine Learning", "Foundation Models", "Agentic AI", "Research", "Multimodal", "Computer Vision"]
defaultAuthor: "Adriel Kuek"
language: "en"
shortName: "Adriel Kuek"
images:
  - "/images/og-default.avif"

favicon:
  svg: "/favicon.svg"

# Author info (displayed on home page author section)
author:
  name: "Adriel Kuek"
  title: "Lab Director · Principal Member of Technical Staff"
  description: "AI Research · Foundation Models · Agentic Systems. Building sovereign multimodal AI, agentic systems, and autonomous research workflows at DSO National Laboratories."
  avatar: "/images/avatar.png"
  social:
    - name: "GitHub"
      url: "https://github.com/adrielkuek"
      icon: "github"
    - name: "LinkedIn"
      url: "https://www.linkedin.com/in/adrielkuek/"
      icon: "linkedin"
    - name: "Google Scholar"
      url: "https://scholar.google.com/citations?user=JBB2mf8AAAAJ&hl=en"
      icon: "star"
    - name: "X"
      url: "https://x.com/adriel_kuek"
      icon: "twitter"
    - name: "Email"
      url: "mailto:adrielkuek@gmail.com"
      icon: "email"

# Header
header:
  sticky: true
  logo:
    image: ""
    link: "/"
  showThemeSwitch: true
  showDarkModeSwitch: true
  showLanguageSwitch: false
  languageSwitchMode: "dropdown"

dock: "scroll"
contentWidth: "56rem"

toc:
  enabled: true
  position: "center"

colorScheme: "slate"
themes:
  default:
    name: "Default"
    order: 1
  claude:
    name: "Claude"
    order: 2
  bumblebee:
    name: "Bumblebee"
    order: 3
  emerald:
    name: "Emerald"
    order: 4
  nord:
    name: "Nord"
    order: 5
  sunset:
    name: "Sunset"
    order: 6
  abyss:
    name: "Abyss"
    order: 7
  dracula:
    name: "Dracula"
    order: 8
  amethyst:
    name: "Amethyst"
    order: 9
  slate:
    name: "Slate"
    order: 10
  twitter:
    name: "Twitter"
    order: 11
  minimal:
    name: "Minimal"
    order: 12

# Home page
home:
  recentPostsCount: 5
  contentOrder:
    - author-section
    - page-content
    - recent-posts
    - publications-list.html
    - featured-projects.html

# Post config
post:
  showRelated: true
  relatedPostsCount: 3
  license:
    show: true
    author: "Adriel Kuek"
    name: "CC BY-NC-SA 4.0"
    description: "This work is licensed under a Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License."
    url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    displayName: "CC BY-NC-SA 4.0"

comments:
  enabled: false
  system: "giscus"

analytics:
  enabled: false

katex:
  enabled: true
  delimiters:
    - left: "$$"
      right: "$$"
      display: true
    - left: "$"
      right: "$"
      display: false
    - left: "\\("
      right: "\\)"
      display: false
    - left: "\\["
      right: "\\]"
      display: true

mermaid:
  enabled: true

gallery:
  enabled: true
  defaultLayout: justified
  gap: 10

lightbox:
  enabled: true

codeblock:
  collapse:
    enabled: true
    defaultState: expanded
    autoCollapseLines: 30

readingProgress:
  enabled: true
  showOnHomepage: false

dateFormat:
  full: ":date_full"
  long: ":date_long"
  medium: ":date_medium"
  short: ":date_short"

timeFormat:
  full: ":time_full"
  long: ":time_long"
  medium: ":time_medium"
  short: ":time_short"
