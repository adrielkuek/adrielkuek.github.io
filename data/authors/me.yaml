bio: |
  I lead research in Foundation Models and emerging AI technologies at DSO National Laboratories,
  with a focus on sovereign multimodal & language models, agentic systems, and autonomous research
  workflows for defence and national security applications.

  Over 15+ years I've worked across signal processing, embedded systems, large-scale video analytics,
  computer vision, multimodal AI, and foundation models — most days are still spent on optimisation
  problems, research strategy, and figuring out the next operationally impactful AI capability.

